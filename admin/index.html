<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA+ TV — Gestor</title><link rel="stylesheet" href="admin.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><strong>NOVA<span>+</span> TV</strong><small>Gestor de canales</small></div>
  <div class="actions"><span id="apiStatus" class="status">API sin comprobar</span><button id="btnToken">🔐 Token</button></div>
</header>
<nav class="views">
  <button class="viewbtn active" data-view="channels">Canales</button>
  <button class="viewbtn" data-view="playlists">Listas</button>
  <button class="viewbtn" data-view="categories">Categorías</button>
  <button class="viewbtn" data-view="reports">Reportes <b id="reportBadge"></b></button>
</nav>
<main>
<section id="channels" class="view active">
  <div class="toolbar">
    <input id="search" placeholder="Buscar canal, categoría o URL…">
    <select id="playlistFilter"></select><select id="categoryFilter"></select>
    <button id="btnNewChannel" class="primary">+ Nuevo canal</button>
    <label class="filebtn">Importar M3U<input id="m3uFile" type="file" accept=".m3u,.m3u8,text/plain"></label>
  </div>
  <div class="stats"><span id="statsText"></span></div>
  <div class="workspace">
    <form id="channelForm" class="editor glass">
      <h2>Datos del canal</h2><input id="channelId" type="hidden">
      <div class="grid2">
        <label>Lista<select id="playlistId" required></select></label>
        <label>Número<input id="number"></label>
      </div>
      <label>Nombre<input id="name" required></label>
      <div class="grid2"><label>Categoría<select id="categoryId" required></select></label><label>ID / EPG ID<input id="epgId"></label></div>
      <label>Logo<input id="logoUrl"></label>
      <label>Enlace M3U8 / Stream<textarea id="streamUrl" rows="3" required></textarea></label>
      <label>Respaldo<textarea id="backupUrl" rows="2"></textarea></label>
      <div class="grid2"><label>TVG ID<input id="tvgId"></label><label>Proveedor<input id="provider"></label></div>
      <div class="grid2"><label>Orden<input id="sortOrder" type="number" value="0"></label><label class="checks"><input id="active" type="checkbox" checked> Canal activo</label></div>
      <div class="formActions"><button class="primary" type="submit">Guardar canal</button><button id="btnDeleteChannel" type="button" class="danger">Eliminar</button><button id="btnClear" type="button">Limpiar</button></div>
    </form>
    <div class="listpanel glass"><h2>Canales</h2><div id="channelList" class="channelList"></div></div>
  </div>
</section>

<section id="playlists" class="view">
  <div class="sectionHead"><div><h1>Listas de reproducción</h1><p>Crea, renombra, ordena o elimina listas.</p></div><button id="btnNewPlaylist" class="primary">+ Nueva lista</button></div>
  <div id="playlistCards" class="cards"></div>
</section>
<section id="categories" class="view">
  <div class="sectionHead"><div><h1>Categorías</h1><p>Crea y renombra categorías usadas por los canales.</p></div><button id="btnNewCategory" class="primary">+ Nueva categoría</button></div>
  <div id="categoryCards" class="cards"></div>
</section>
<section id="reports" class="view">
  <div class="sectionHead"><div><h1>Reportes</h1><p>Reportes enviados desde móvil y Smart TV.</p></div><button id="btnReloadReports">Actualizar</button></div>
  <div id="reportCards" class="cards"></div>
</section>
</main>

<dialog id="simpleDialog"><form id="simpleForm" method="dialog"><h2 id="simpleTitle"></h2><input id="simpleId" type="hidden"><input id="simpleType" type="hidden"><label>Nombre<input id="simpleName" required></label><label>Slug<input id="simpleSlug"></label><label>Orden<input id="simpleOrder" type="number" value="0"></label><label class="checks"><input id="simpleActive" type="checkbox" checked> Activo</label><div class="formActions"><button value="cancel">Cancelar</button><button class="primary" value="default" id="simpleSave">Guardar</button></div></form></dialog>
<dialog id="tokenDialog"><form id="tokenForm" method="dialog"><h2>Token administrativo</h2><label>ADMIN_TOKEN<input id="token" type="password" required></label><div class="formActions"><button value="cancel">Cancelar</button><button class="primary" value="default">Usar token</button></div></form></dialog>
<div id="toast"></div>
<script src="admin.js"></script>
</body></html>
